# Potongan yang disalin ke ~/.hermes/config.yaml di kunci `hooks:`
# Butuh consent pertama kali (atau HERMES_ACCEPT_HOOKS=1).

hooks:
  pre_tool_call:
    - command: "~/.hermes/agent-hooks/niu-fence.py"
      timeout: 5
  pre_llm_call:
    - command: "~/.hermes/agent-hooks/niu-model-guard.py"
      timeout: 5
  on_session_end:
    - command: "~/.hermes/agent-hooks/niu-session-end-capture.py"
      timeout: 8
