# KEADAAN AKHIR ~/.hermes/config.yaml — v2 (model-resilient)
# JANGAN paste menimpa 18.6 KB. Terapkan via hermes config / hermes fallback.
# SALAH (v1): fallback ke 9router / juan / huancheng / gratislonggar
# BENAR: otak hanya keluarga OpenCode Zen free.

model:
  default: big-pickle
  provider: opencode-zen
  base_url: https://opencode.ai/zen/v1
  api_mode: chat_completions

# SATU kaki fallback, keluarga yang sama. Bukan zoo.
fallback_providers:
  - provider: opencode-zen
    model: deepseek-v4-flash-free

# Setelah kaki itu gagal: BERHENTI. Jangan hop ke 9router.
# Plugin niu-core-fence akan mem-fence tulis core jika model berganti.

cron:
  model: big-pickle
  model_provider: opencode-zen
  model_drift_guard: true
  preflight: true

compression:
  enabled: true
  threshold: 0.50

auxiliary:
  compression:
    provider: opencode-zen
    model: deepseek-v4-flash-free
    reasoning_effort: low
    max_concurrency: 1
  title_generation:
    provider: opencode-zen
    model: deepseek-v4-flash-free
    max_concurrency: 1

plugins:
  enabled:
    - rtk-rewrite
    - niu-core-fence
  disabled:
    - hermes-achievements
    - telegram_router

hooks:
  pre_tool_call:
    - command: "~/.hermes/agent-hooks/niu-fence.py"
      timeout: 5
  pre_llm_call:
    - command: "~/.hermes/agent-hooks/niu-model-guard.py"
      timeout: 5
  on_session_end:
    - command: "~/.hermes/agent-hooks/niu-session-end-capture.py"
      timeout: 8

# providers 9router/juan/huancheng/agentrouter BOLEH tetap terdaftar
# sebagai infrastruktur — jangan dipakai /model untuk kerja core,
# jangan masuk fallback_providers.
