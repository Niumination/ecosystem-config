<!doctype html>
<!--
  Known-good starter for a 9:16 short (1080x1920 @30fps).
  Copy, then: extend scenes (5-8s each), swap copy, vendor GSAP into ./assets/, run
  `npx --no-install hyperframes lint --verbose` and fix anything it reports.
  Pattern that survives lint: every <section class="clip"> wraps its content in ONE
  <div class="inner" id="sNin"> that owns all layout; exit fades target the inner
  wrapper and are followed by a tl.set hard kill at the next scene's clip start.
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070b10;
        font-family: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
        color: #f2f6f8; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background:
          radial-gradient(1200px 900px at 10% 4%, rgba(53, 208, 165, 0.17), transparent 62%),
          radial-gradient(1000px 1000px at 92% 98%, rgba(56, 122, 235, 0.15), transparent 64%),
          linear-gradient(168deg, #0a1017 0%, #070b10 55%, #0b1218 100%); }
      .grid { position: absolute; inset: 0; opacity: 0.5;
        background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 120px 120px; }
      .brandbar { position: absolute; top: 74px; left: 96px; right: 96px; display: flex;
        align-items: center; gap: 20px; z-index: 8; }
      .branddot { width: 20px; height: 20px; border-radius: 50%; background: #35d0a5;
        box-shadow: 0 0 26px rgba(53, 208, 165, 0.9); }
      .brandname { font-size: 30px; letter-spacing: 0.34em; text-transform: uppercase;
        color: #93a3af; font-weight: 600; }
      .brandright { margin-left: auto; font-size: 26px; letter-spacing: 0.2em;
        color: #5d6d78; text-transform: uppercase; font-weight: 600; }
      .track { position: absolute; left: 96px; right: 96px; bottom: 92px; height: 8px;
        background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; z-index: 8; }
      .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #35d0a5, #63e6c2); }
      .clip { position: absolute; inset: 0; z-index: 2; }
      .inner { position: absolute; inset: 0; display: flex; flex-direction: column;
        justify-content: center; padding: 210px 96px 230px 96px; }
      .wnum { position: absolute; right: 88px; bottom: 168px; font-size: 300px; font-weight: 800;
        line-height: 1; color: rgba(255,255,255,0.035); letter-spacing: -0.05em; }
      .kicker { font-size: 32px; letter-spacing: 0.3em; text-transform: uppercase;
        color: #35d0a5; font-weight: 700; margin-bottom: 32px; }
      .headline { font-size: 116px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; }
      .headline .accent { color: #35d0a5; }
      .headline.md { font-size: 94px; }
      .sub { margin-top: 42px; font-size: 42px; line-height: 1.38; color: #a9b6c0; font-weight: 500; }
      .rule { width: 220px; height: 8px; background: #35d0a5; border-radius: 999px; margin-top: 44px; }
      .chips { display: flex; gap: 20px; margin-top: 52px; flex-wrap: wrap; }
      .chip { font-size: 36px; font-weight: 650; color: #dbe4ea; border: 3px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.04); border-radius: 999px; padding: 22px 38px; }
      .chip.hot { border-color: rgba(53,208,165,0.65); color: #35d0a5; background: rgba(53,208,165,0.1); }
      .stat { display: flex; align-items: center; gap: 36px; background: rgba(255,255,255,0.035);
        border: 3px solid rgba(255,255,255,0.08); border-radius: 34px; padding: 34px 40px; }
      .stat .num { font-size: 118px; font-weight: 800; color: #35d0a5; min-width: 250px; line-height: 1; }
      .stat .lbl { font-size: 42px; color: #cbd6de; font-weight: 600; line-height: 1.32; }
      .stats { display: flex; flex-direction: column; gap: 26px; margin-top: 24px; }
      .cta { margin-top: 44px; display: inline-flex; align-items: center; gap: 24px; background: #35d0a5;
        color: #05221a; font-size: 50px; font-weight: 800; padding: 38px 54px; border-radius: 999px;
        align-self: flex-start; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reelstpl" data-start="0" data-duration="15"
         data-width="1080" data-height="1920" data-fps="30">
      <div class="grid"></div>

      <div class="brandbar">
        <div class="branddot"></div>
        <div class="brandname">Niumination</div>
        <div class="brandright">Aceh Tengah</div>
      </div>

      <div class="track"><div class="fill" id="fill"></div></div>

      <!-- 1. HOOK -->
      <section id="s1" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="wnum">01</div>
        <div class="inner" id="s1in">
          <div class="kicker" id="s1k">Behind the build</div>
          <div class="headline" id="s1h"><span class="accent">143 skill AI</span><br />dibangun sendiri.</div>
          <div class="rule" id="s1r"></div>
          <div class="sub" id="s1s">Pranata komputer, Diskominfo Aceh Tengah.</div>
          <div class="chips">
            <div class="chip" id="s1c1">Naskah</div>
            <div class="chip" id="s1c2">Video</div>
            <div class="chip" id="s1c3">Tayang</div>
            <div class="chip hot" id="s1c4">Rp 0</div>
          </div>
        </div>
      </section>

      <!-- 2. PROOF -->
      <section id="s2" class="clip" data-start="5" data-duration="5" data-track-index="2">
        <div class="wnum">02</div>
        <div class="inner" id="s2in">
          <div class="kicker" id="s2k">Yang jalan hari ini</div>
          <div class="stats">
            <div class="stat" id="s2a"><div class="num">49</div><div class="lbl">repo git<br />di satu laptop</div></div>
            <div class="stat" id="s2b"><div class="num">4</div><div class="lbl">aplikasi live<br />di Vercel</div></div>
          </div>
        </div>
      </section>

      <!-- 3. CTA -->
      <section id="s3" class="clip" data-start="10" data-duration="5" data-track-index="3">
        <div class="wnum">03</div>
        <div class="inner" id="s3in">
          <div class="kicker" id="s3k">Ikuti prosesnya</div>
          <div class="headline md" id="s3h">Semua alatnya<br /><span class="accent">gratis.</span></div>
          <div class="cta" id="s3cta">Niumination</div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // progress bar spans the whole composition
      tl.fromTo("#fill", { width: "0%" }, { width: "100%", duration: 15, ease: "none" }, 0);

      // scene 1
      tl.fromTo("#s1k", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.15);
      tl.fromTo("#s1h", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 0.45);
      tl.fromTo("#s1r", { opacity: 0, width: 0 }, { opacity: 1, width: 220, duration: 0.5 }, 1.0);
      tl.fromTo("#s1s", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55 }, 1.2);
      tl.fromTo("#s1c1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4 }, 1.75);
      tl.fromTo("#s1c2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4 }, 1.95);
      tl.fromTo("#s1c3", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4 }, 2.15);
      tl.fromTo("#s1c4", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 2.4);
      tl.to("#s1in", { opacity: 0, duration: 0.4 }, 4.6);
      tl.set("#s1in", { opacity: 0 }, 5.0);

      // scene 2
      tl.fromTo("#s2k", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 5.2);
      tl.fromTo("#s2a", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 5.5);
      tl.fromTo("#s2b", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 6.2);
      tl.to("#s2in", { opacity: 0, duration: 0.4 }, 9.6);
      tl.set("#s2in", { opacity: 0 }, 10.0);

      // scene 3 (last scene: no exit tween needed)
      tl.fromTo("#s3k", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 10.2);
      tl.fromTo("#s3h", { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 10.45);
      tl.fromTo("#s3cta", { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 11.4);

      window.__timelines["reelstpl"] = tl;
    </script>
  </body>
</html>
