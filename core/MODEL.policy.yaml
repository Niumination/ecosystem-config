# Kebijakan model Niumination — TERSEGEEL
# Hanya manusia zaryu yang boleh mengubah file ini.
# Agen yang bukan keluarga di bawah = bukan otak.

schema: niu-model-policy/v2
updated: 2026-08-21

family: opencode-zen-free
provider: opencode-zen
base_url: https://opencode.ai/zen/v1

allowed:
  - provider: opencode-zen
    role: primary
    models: [big-pickle, nemotron-3-ultra-free, hy3-free]
    note: free tier Zen; + semua model berakhiran *-free (prinsip, self-update)
  - provider: nous
    role: same-tier-alternate
    note: OAuth2 Hermes (hermes auth); model free = berakhiran :free (katalog live di model_catalog.json -> providers.nous)

# Model pensiun (D-0002) dipulihkan oleh D-0004 untuk free tier
retired: []   # D-0004 memulihkan big-pickle + seluruh free tier Zen (termasuk deepseek-v4-flash-free)

# Boleh disebut di config sebagai infrastruktur — JANGAN jadi pemikir sesi core
infrastructure_not_thinker:
  - 9router          # localhost:20128 — transport, bukan otak
  - agentrouter
  - juan-router
  - huancheng

forbidden_thinkers:
  - juan-router/agnes-2.0-flash
  - 9router/cf/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b
  - 9router/gratislonggar
  - 9router/gemini/gemini-3.x
  - 9router/gc/gemini-2.5-pro
  - 9router/gemini/gemma-4
  - 9router/cf/@cf/zai-org
  - huancheng/DeepSeek-V4-Flash
  - agentrouter/*
  - tencent/hy3:free

on_rate_limit:
  action: same-provider-or-halt
  same_provider_fallback:
    - provider: opencode-zen
      model: nemotron-3-ultra-free
    - provider: opencode-zen
      model: hy3-free
  after_switch: fence_core_writes   # TETAP (anti-waste) — jangan dilonggarkan
  never:
    - hop to 9router
    - hop to juan-router
    - hop to huancheng
    - hop to model pensiun (big-pickle / deepseek-v4-flash-free)
    - continue the same mutating task silently

on_foreign_model_detected:
  action: halt_mutating_tools
  write_handoff: true
  inject: "Kamu bukan otak yang diizinkan. Baca core/runtime/HANDOFF.md. Jangan tulis file."

telegram:
  # Snapshot 2026-08-21 — free tier Zen + Nous Portal (D-0004).
  unify_to: opencode-zen/nemotron-3-ultra-free
  alternate: opencode-zen/hy3-free
  threads: ["1", "802", "803", "804", "1172"]

cron:
  pin_provider: opencode-zen
  pin_model: nemotron-3-ultra-free
  drift_guard: true
  agent_jobs_allowed:
    - Pemdi-Learning-Reminder   # satelit, terpin, jangan diperluas
  # agent-reach-watch: pin dulu; pertimbangkan ubah ke no-agent

compression:
  provider: opencode-zen
  model: hy3-free
  threshold: 0.50
  # Jangan pakai 9router/gratislonggar untuk merangkum memori core
